<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Triangle Logo -->
  <g transform="translate(50, 50)">
    <!-- Outer triangle -->
    <path d="M50 20 L90 80 L10 80 Z" fill="#2D2D2D" stroke="none"/>
    <!-- Inner triangle -->
    <path d="M50 35 L75 70 L25 70 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Center triangle -->
    <path d="M50 50 L60 65 L40 65 Z" fill="#2D2D2D" stroke="none"/>
  </g>
  
  <!-- SELGO Text -->
  <g transform="translate(150, 50)">
    <!-- S -->
    <path d="M10 20 Q10 10 20 10 L40 10 Q50 10 50 20 Q50 30 40 30 L20 30 Q10 30 10 40 Q10 50 20 50 L40 50 Q50 50 50 60 Q50 70 40 70 L20 70 Q10 70 10 60" fill="#2D2D2D" stroke="none"/>
    
    <!-- E -->
    <rect x="70" y="10" width="40" height="10" fill="#2D2D2D"/>
    <rect x="70" y="10" width="10" height="60" fill="#2D2D2D"/>
    <rect x="70" y="35" width="30" height="10" fill="#2D2D2D"/>
    <rect x="70" y="60" width="40" height="10" fill="#2D2D2D"/>
    
    <!-- L -->
    <rect x="130" y="10" width="10" height="60" fill="#2D2D2D"/>
    <rect x="130" y="60" width="40" height="10" fill="#2D2D2D"/>
    
    <!-- G -->
    <path d="M190 20 Q190 10 200 10 L220 10 Q230 10 230 20 L230 70 Q230 80 220 80 L200 80 Q190 80 190 70 L190 20 Z" fill="#2D2D2D"/>
    <rect x="200" y="20" width="20" height="50" fill="#FFFFFF"/>
    <rect x="210" y="45" width="20" height="10" fill="#2D2D2D"/>
    <rect x="220" y="45" width="10" height="25" fill="#2D2D2D"/>
    
    <!-- O (Red circle) -->
    <circle cx="270" cy="45" r="25" fill="#FF6B6B" stroke="none"/>
    <circle cx="270" cy="45" r="15" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>